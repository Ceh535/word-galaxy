<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Word Galaxy">
<meta name="theme-color" content="#170f45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Arlo's Word Galaxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&family=Fredoka:wght@500;600;700&family=Lexend:wght@500;700&family=Comic+Neue:wght@700&display=swap">
<style>
/* Layout: one-screen space mission. Starfield canvas behind; header with astronaut helmet (his face); cards float like control panels. Single committed deep-space look. */
:root{
  --space:#170f45; --space2:#25196b; --panel:#2e2280; --panel2:#3b2d9c; --edge:#5a4bd1;
  --ink:#ffffff; --soft:#c6c0f2; --star:#ffd23f; --rocket:#ff5d73; --mint:#3ee6c1; --sky:#5cc8ff; --plum:#c77dff;
  --good:#3ee6c1; --bad:#ff6b6b;
  --display:"Lilita One","Fredoka","Trebuchet MS",system-ui,sans-serif;
  --ui:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --word:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(ellipse 55% 40% at 85% 8%,#ff5d7333,transparent 70%) fixed,radial-gradient(ellipse 50% 45% at 8% 35%,#3ee6c122,transparent 70%) fixed,radial-gradient(ellipse 60% 50% at 60% 95%,#c77dff33,transparent 70%) fixed,radial-gradient(ellipse at 70% -10%,#3b2a9e 0%,var(--space) 55%) fixed,var(--space);color:var(--ink);font-family:var(--ui);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-visible{outline:3px solid var(--star);outline-offset:3px}
.app{position:relative;z-index:1;max-width:920px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box}
h1,h2,h3{margin:0;font-weight:400}
.label{font-family:var(--ui);font-size:.85rem;text-transform:uppercase;letter-spacing:.12em;color:var(--soft);font-weight:600}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.helmet{width:72px;height:72px;border-radius:50%;flex:none;position:relative;background:var(--panel2);border:5px solid #e9e6ff;box-shadow:0 0 0 4px var(--rocket),0 6px 18px #0008;overflow:hidden;display:grid;place-items:center;font-size:2.2rem}
.helmet img{width:100%;height:100%;object-fit:cover}
.helmet::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#ffffff55 0 18%,transparent 34%)}
.helmet.big{width:150px;height:150px;font-size:4.4rem;border-width:8px;box-shadow:0 0 0 6px var(--rocket),0 0 40px #5cc8ff66}
.title{font-family:var(--display);font-size:clamp(1.7rem,5vw,2.6rem);line-height:1;letter-spacing:.01em;text-shadow:0 3px 0 #0006}
.tsmall{display:block;font-family:var(--ui);font-weight:700;font-size:.42em;letter-spacing:.14em;text-transform:uppercase;color:var(--star);margin-bottom:2px;text-shadow:none}
.tplanet{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.12em;margin-left:.15em;animation:spinbob 6s ease-in-out infinite}.tplanet svg{width:100%;height:100%}
.title .b{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;background:var(--star);color:var(--space);margin-left:.1em;transform:rotate(-8deg);box-shadow:0 3px 0 #b8901a}
.sub{color:var(--soft);font-size:.95rem;margin-top:4px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{font-family:var(--ui);font-weight:700;font-size:1.15rem;background:#ffffff14;border:2px solid #ffffff2a;border-radius:999px;padding:8px 16px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.chip .s{color:var(--star)}

/* home */
.hero{background:linear-gradient(160deg,var(--panel2),var(--panel));border:3px solid var(--edge);border-radius:28px;padding:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.hero .info{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:10px}
.hero h2{font-family:var(--display);font-size:1.7rem}
.fuel{height:22px;border-radius:99px;background:#0004;overflow:hidden;border:2px solid #ffffff33}
.fuel i{display:block;height:100%;background:linear-gradient(90deg,var(--rocket),var(--star));border-radius:99px;transition:width .6s}
.planetmini{width:110px;height:110px;flex:none;filter:drop-shadow(0 0 24px #ffffff2a);animation:spinbob 6s ease-in-out infinite}
@keyframes spinbob{50%{transform:translateY(-6px) rotate(4deg)}}
.planetart{width:100%;height:100%;display:block;overflow:visible}
.rk{display:block;overflow:visible}
.rk .flame{transform-origin:30px 84px;animation:flick .11s infinite alternate}
@keyframes flick{to{transform:scaleY(.7) scaleX(.9)}}
.bigplanet{position:fixed;right:-130px;bottom:-110px;width:400px;height:400px;z-index:0;opacity:.28;pointer-events:none;animation:drift 14s ease-in-out infinite}
@keyframes drift{50%{transform:translate(-14px,-10px) rotate(3deg)}}
.game .ico svg{width:56px;height:56px;display:block}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff06 0 2px,transparent 2px 6px);pointer-events:none}
.stage{position:relative}
.stage::before,.stage::after{content:"";position:absolute;top:12px;width:10px;height:10px;border-radius:50%;background:#ffffff33;box-shadow:0 0 0 2px #0002}
.stage::before{left:14px}.stage::after{right:14px}
.slot{box-shadow:inset 0 0 14px #5cc8ff22;background:linear-gradient(#0a0630aa,#1a1260aa)}
.slot.filled{box-shadow:inset 0 0 14px #5cc8ff44,0 0 10px #5cc8ff33}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.set{background:#ffffff10;border:3px solid #ffffff22;border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.set[aria-pressed="true"]{border-color:var(--mint);background:#3ee6c118;box-shadow:0 0 22px #3ee6c144}
.set h3{font-family:var(--display);font-size:1.3rem}
.set p{margin:0;color:var(--soft);font-size:.95rem}
.bar{height:10px;border-radius:99px;background:#0005;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:99px}
.example{font-size:.8rem;color:var(--star);font-weight:700}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.game{border-radius:24px;padding:18px;text-align:left;display:flex;gap:14px;align-items:center;min-height:100px;border-bottom:7px solid #0005;transition:transform .12s}
.game:active{transform:translateY(3px)}
.game.listen{background:var(--rocket)}
.game.scramble{background:#4b7bff}
.game.meteor{background:#8b4dff}
.game .ico{font-size:2.5rem;width:66px;height:66px;border-radius:20px;background:#ffffff2e;display:grid;place-items:center;flex:none}
.game b{font-family:var(--display);font-size:1.45rem;display:block;font-weight:400}
.game span{font-size:.98rem}
.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{font-weight:600;color:var(--soft);padding:10px 4px;font-size:1.05rem}

/* play */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.track{flex:1 1 200px;min-width:0;position:relative;height:36px;display:flex;align-items:center}
.track .line{position:absolute;left:0;right:0;height:6px;border-radius:9px;background:#ffffff22}
.track .done{position:absolute;left:0;height:6px;border-radius:9px;background:var(--star);transition:width .5s}
.track .ship{position:absolute;width:26px;height:46px;transform:translateX(-50%) rotate(90deg);transition:left .5s}
.track .goal{position:absolute;right:-10px;width:40px;height:40px}
.stage{background:linear-gradient(170deg,var(--panel2),var(--panel));border:3px solid var(--edge);border-radius:30px;padding:20px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 14px 40px #0006}
.combo{font-family:var(--display);font-size:1.15rem;color:var(--star);min-height:1.4em}
.hear{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{font-weight:700;font-size:1.15rem;border-radius:18px;padding:13px 20px;background:#ffffff1c;display:flex;gap:8px;align-items:center;border-bottom:5px solid #0004}
.big.main{background:var(--sky);color:var(--space)}
.peekword{font-family:var(--word);font-size:clamp(2.4rem,8vw,3.6rem);font-weight:700;letter-spacing:.05em;min-height:1.3em;line-height:1.3;color:var(--star)}
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:70px}
.slot{width:56px;height:66px;background:#0003;border-bottom:5px solid #ffffff44;display:grid;place-items:center;font-family:var(--word);font-size:2.4rem;font-weight:700;border-radius:12px 12px 6px 6px}
.slot.filled{border-color:#fff}
.slot.gap{border:3px dashed var(--star);background:#ffd23f18;color:var(--star)}
.slot.ok{color:var(--good);border-color:var(--good);background:#3ee6c11f}
.slot.no{color:var(--bad);border-color:var(--bad);background:#ff6b6b1f}
.msg{font-family:var(--display);font-size:1.6rem;min-height:1.4em;text-align:center;text-wrap:balance}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.keys{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.row{display:flex;gap:6px;justify-content:center;width:100%}
.key,.tile,.rock{font-family:var(--word);font-weight:700;font-size:1.7rem;background:#f3f1ff;color:var(--space);border-radius:14px;height:60px;flex:1 1 0;max-width:64px;min-width:0;border-bottom:6px solid #a59de0}
.key:active,.tile:active,.rock:active{transform:translateY(3px);border-bottom-width:3px}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{width:64px;flex:none;background:linear-gradient(#ffe27a,var(--star));border-bottom-color:#b8901a;box-shadow:inset 0 2px 0 #fff8,0 4px 12px #ffd23f44}
.key{background:linear-gradient(#ffffff,#e9e6ff);box-shadow:inset 0 2px 0 #fff}

/* top scene v2 */
.hero.scene{border:0;border-radius:32px;padding:22px 22px 70px;min-height:290px;grid-template-columns:190px 1fr 150px;
  background:radial-gradient(ellipse 55% 70% at 88% 0%,#ff5d7342,transparent 70%),radial-gradient(ellipse 45% 60% at 8% 0%,#5cc8ff33,transparent 70%),linear-gradient(180deg,#2d2192,#160f4c);
  box-shadow:inset 0 0 0 2px #ffffff1c,inset 0 -50px 60px #0005,0 22px 44px #0009}
.hero.scene::before{background:radial-gradient(1.4px 1.4px at 22% 24%,#fff,transparent 60%),radial-gradient(1px 1px at 38% 12%,#fff,transparent 60%),radial-gradient(1.6px 1.6px at 55% 30%,#fff,transparent 60%),radial-gradient(1px 1px at 70% 14%,#fff,transparent 60%),radial-gradient(1.3px 1.3px at 12% 52%,#fff,transparent 60%),radial-gradient(1px 1px at 48% 8%,#c9e8ff,transparent 60%),radial-gradient(1.2px 1.2px at 92% 48%,#fff,transparent 60%);opacity:.9}
.hero.scene .guide{width:190px;align-self:end;margin-bottom:-40px}
.hero.scene .flag{position:absolute;left:196px;bottom:34px;width:34px;z-index:1;transform-origin:bottom left;animation:flagwave 3s ease-in-out infinite}
@keyframes flagwave{50%{transform:rotate(-3deg) skewY(-2deg)}}
.scene .info{display:flex;flex-direction:column;gap:12px;min-width:0}
.speech{border-radius:22px;padding:14px 18px;box-shadow:0 6px 0 #c9c3f0,0 14px 28px #0006}
.fuelbox{background:#0a0631b3;border:2px solid #ffffff1c;border-radius:18px;padding:10px 12px 12px;box-shadow:inset 0 1px 0 #ffffff14}
.fuelhead{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.92rem;color:var(--soft);margin-bottom:8px}
.fuelnum{color:var(--star);font-variant-numeric:tabular-nums;white-space:nowrap}
.hero.scene .fuel{height:24px;border:0;background:#05031c;box-shadow:inset 0 3px 6px #000c,0 0 0 2px #ffffff1f;position:relative}
.hero.scene .fuel i{background:linear-gradient(#ffffff66,#ffffff00 55%),repeating-linear-gradient(-45deg,#ffffff26 0 8px,transparent 8px 16px),linear-gradient(90deg,#ff5d73,#ffa21f 60%,#ffd23f);background-size:auto,23px 23px,auto;animation:stripes 1s linear infinite;box-shadow:0 0 16px #ffa21f99}
@keyframes stripes{to{background-position:0 0,23px 0,0 0}}
.hero.scene .fuel::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 2px),#ffffff2e calc(25% - 2px) 25%);pointer-events:none}
.nowlbl{color:var(--soft);font-size:.92rem}.nowlbl b{color:#fff}
.nextwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;align-self:start}
.nextwrap .planetmini{width:118px;height:118px}
.orbitring{position:absolute;top:-12px;width:142px;height:142px;border-radius:50%;border:2px dashed #ffffff30;animation:spin 30s linear infinite}
.scene .nextlbl{margin:0;background:#0a0631b3;border:1px solid #ffffff22;border-radius:99px;padding:4px 10px;white-space:nowrap}
.hero.scene .ground{left:-25%;right:-25%;bottom:-170px;height:240px;box-shadow:inset 0 8px 0 #ffffff40,inset 0 20px 40px #ffffff22,0 -12px 40px color-mix(in srgb,var(--g1) 45%,transparent)}
@media (max-width:640px){.hero.scene{grid-template-columns:120px 1fr;padding:18px 14px 60px}.hero.scene .guide{width:120px}.hero.scene .flag{left:118px;width:26px}.nextwrap{display:none}}
/* mission map */
.mapwrap{position:relative;width:100%;max-width:780px;margin:14px auto 0;aspect-ratio:1/1}
.trail{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.trail path{fill:none;stroke:#ffffff59;stroke-width:5;stroke-linecap:round;stroke-dasharray:1 14;vector-effect:non-scaling-stroke;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-15}}
.station{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:210px;text-align:center}
.orb{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 34% 28%,var(--c1),var(--c2) 72%);box-shadow:inset -16px -18px 0 #0003,inset 10px 10px 0 #ffffff2e,0 0 0 7px #ffffff14,0 0 46px color-mix(in srgb,var(--c1) 60%,transparent);animation:orbbob 4.5s ease-in-out infinite;transition:transform .15s}
.station:nth-child(3) .orb{animation-delay:-1.2s}.station:nth-child(4) .orb{animation-delay:-2.4s}.station:nth-child(5) .orb{animation-delay:-3.4s}
@keyframes orbbob{50%{transform:translateY(-9px)}}
.station:active .orb{transform:scale(.94)}
.station{padding-top:14px}
.orb::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px dashed #ffffff26;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orb svg{width:84px;height:84px;filter:drop-shadow(0 4px 0 #0003)}
.orb .face{width:96px;height:96px;border-radius:50%;overflow:hidden;border:5px solid #fff;display:block;box-shadow:0 4px 0 #0003}
.orb .face svg{width:100%;height:100%;filter:none}
.slabel{font-family:var(--display);font-size:1.35rem;background:#fff;color:var(--space);padding:6px 16px;border-radius:16px;box-shadow:0 5px 0 #c9c3f0;line-height:1.1}
.sdesc{color:var(--soft);font-size:.95rem;font-weight:600;margin-top:-2px;white-space:nowrap}
.sdesc b{color:var(--star)}
.mapdeco{position:absolute;pointer-events:none}
/* cockpit */
.stage.cockpit{overflow:hidden;padding-top:0}
.window{position:relative;align-self:stretch;margin:0 -16px;height:210px;overflow:hidden;background:radial-gradient(ellipse at 80% 50%,#3b2a9e,#0d0830 70%);border-bottom:6px solid var(--edge);border-radius:0 0 50% 50%/0 0 34px 34px}
.window .warp,.window .warp2{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1.2px,transparent 1.6px);background-size:70px 50px;animation:warp 6s linear infinite;opacity:.6}
.window .warp2{background-image:radial-gradient(circle,#c9e8ff 1.6px,transparent 2px);background-size:130px 90px;animation-duration:3.2s;background-position:30px 20px;opacity:.8}
@keyframes warp{to{background-position-x:-140px}}
.window .dest{position:absolute;right:9%;top:50%;transform:translate(0,-50%);transition:width .6s,height .6s;filter:drop-shadow(0 0 28px #ffffff40)}
.window .buddy{display:block;left:9%;top:auto;bottom:16px;width:96px}
.window .wcombo{position:absolute;left:0;right:0;top:12px;text-align:center}
.window::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#ffffff14 0 18%,transparent 30%);pointer-events:none}
@media (max-width:760px){.window .buddy{width:74px}}
@media (max-width:540px){.mapwrap{aspect-ratio:3/4.4}.station{width:150px}.orb{width:100px;height:100px}.orb svg{width:58px;height:58px}.orb .face{width:64px;height:64px}.slabel{font-size:1.05rem;padding:5px 10px}.sdesc{font-size:.82rem}.window{height:170px}}
@media (prefers-reduced-motion:reduce){.orb,.orb::before,.trail path,.window .warp,.window .warp2{animation:none}}

/* ---- mission scenes ---- */
.newtag{font-family:var(--display);font-size:1.1rem;color:var(--space);background:var(--star);padding:6px 16px;border-radius:99px;box-shadow:0 4px 0 #b8901a;animation:boing .5s cubic-bezier(.3,1.6,.5,1) both}

.stage.m-listen{background:linear-gradient(170deg,#1c2b74,#121a4d);border-color:#3d5bd6}
.stage.m-listen .key{background:linear-gradient(#33479f,#1f2c72);color:#eaf2ff;border-bottom-color:#0b1240;box-shadow:inset 0 0 0 2px #5cc8ff55,0 0 12px #5cc8ff2a}
.stage.m-listen .slot{border-bottom-color:#5cc8ff66}
.pad{position:relative;align-self:stretch;margin:0 -16px;height:240px;overflow:hidden;background:linear-gradient(#0d1446,#24358f 75%,#2c3f9e);border-bottom:6px solid #3d5bd6}
.pad::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1px,transparent 1.5px);background-size:46px 38px;opacity:.5}
.pad .buddy{display:block;left:7%;top:auto;bottom:34px;width:88px}
.padbase{position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(90deg,#3a3f6e 0 30px,#30355f 30px 60px);border-top:4px solid #ffd23f}
.tower{position:absolute;left:calc(50% - 74px);bottom:34px;width:22px;height:170px;background:repeating-linear-gradient(0deg,#ff5d73 0 14px,#f2f0ff 14px 28px);border:3px solid #2b1d6e;border-radius:4px}
.lrocket{position:absolute;left:calc(50% - 37px);bottom:30px;transition:none}
.lrocket .rk .flame{opacity:.25}
.lrocket.go{animation:liftoff 1.1s cubic-bezier(.6,0,.9,.5) .1s forwards}
.lrocket.go .rk .flame{opacity:1;transform:scaleY(1.6)}
.lrocket .smoke{position:absolute;left:50%;bottom:-10px;width:10px;height:10px;border-radius:50%;background:#fff;opacity:0}
.lrocket.go .smoke{animation:smoke 1s ease-out forwards;box-shadow:-30px 0 0 14px #ffffffcc,30px 0 0 14px #ffffffcc,0 4px 0 18px #ffffffaa}
@keyframes liftoff{0%{transform:translateY(0)}15%{transform:translate(-2px,2px)}25%{transform:translate(2px,-4px)}100%{transform:translateY(-320px)}}
@keyframes smoke{from{opacity:.9;transform:scale(.5)}to{opacity:0;transform:scale(3)}}
.fuelv{position:absolute;left:calc(50% + 56px);bottom:48px;width:26px;height:150px;border-radius:14px;background:#05031c;box-shadow:inset 0 3px 6px #000c,0 0 0 3px #ffffff2a;overflow:hidden}
.fuelv i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffd23f,#ff5d73);transition:height .35s cubic-bezier(.3,1.4,.5,1);box-shadow:0 0 16px #ffa21f}
.fuelv span{position:absolute;left:-60px;width:52px;text-align:right;bottom:4px;font-weight:700;font-size:.85rem;color:var(--star)}
.padlbl{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:var(--display);font-size:1.15rem;color:#fff;text-shadow:0 2px 0 #0007;padding:0 12px}
.stage.m-scramble{background:linear-gradient(170deg,#1e6a63,#173156);border-color:#3ee6c1}
.alienland{position:relative;align-self:stretch;margin:0 -16px;height:170px;overflow:hidden;background:radial-gradient(ellipse at 70% 0%,#5ee07a44,transparent 60%),linear-gradient(#0f2a4a,#1b5a5a);border-bottom:6px solid #3ee6c1}
.alienground{position:absolute;left:-10%;right:-10%;bottom:-60px;height:110px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2f9e6b 0 10px,transparent 11px),radial-gradient(circle at 70% 25%,#2f9e6b 0 7px,transparent 8px),linear-gradient(#5ee07a,#2f9e6b)}

  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);

  if(a.tagName==="CANVAS")return;
  morphKids(a,b)}

async function makeCertificate(){

  [[150,150],[W-150,150],[150,H-150],[W-150,H-150]].forEach(([a,b])=>star(a,b,34,"#ffd23f"));
  for(let i=0;i<26;i++)star(120+Math.random()*(W-240),120+Math.random()*(H-240),4+Math.random()*5,"#ffd23f55");

  x.fillStyle="#3b3570";x.font="700 44px Fredoka, sans-serif";x.fillText("This is to say that",W/2,420);
  x.fillStyle="#c2246d";x.font="130px 'Lilita One', Fredoka, sans-serif";x.fillText("Astro "+S.name,W/2,560);
  x.strokeStyle="#ffd23f";x.lineWidth=8;x.beginPath();x.moveTo(W/2-360,595);x.lineTo(W/2+360,595);x.stroke();

  x.font="700 34px Fredoka, sans-serif";x.fillStyle="#6c5fd1";x.fillText(new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}),W/2,860);
  // gold seal
  x.save();x.translate(W-300,H-280);x.fillStyle="#ffd23f";x.beginPath();for(let i=0;i<24;i++){const a=i*Math.PI/12,r=i%2?92:110;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();
  x.fillStyle="#d49a00";x.beginPath();x.arc(0,0,76,0,6.29);x.fill();star(0,-6,52,"#fff6c8");x.restore();
  // little rocket on the left
  x.save();x.translate(270,H-300);x.rotate(-.5);x.fillStyle="#ff5d73";x.beginPath();x.moveTo(0,-90);x.quadraticCurveTo(48,-30,30,60);x.lineTo(-30,60);x.quadraticCurveTo(-48,-30,0,-90);x.fill();

  return c;

const VC_SECTIONS=[["words","Letters and spelling words"],["lab","Sound Lab words and chunks"],["slow","Slow words (🐢 button)"],["lines","Tips, instructions and cheers"],["fun","Jokes and facts"],["chars","Astro Arlo, bosses and pals"]];
const VC_WHO={narrator:"",arlo:"Astro Arlo",pet:"Pickle",husky:"Husky",gigi:"Gigi",xaxa:"Xaxa",daddy:"Big Alien Daddy",babyarlo:"Baby Alien Arlo"};

  const groups={};for(const k2 in VOX.map){const pk=VOX.packOf[k2]||"lines";(groups[pk]=groups[pk]||[]).push(k2)}
  const label=k2=>{const parts=k2.split("|"),who=parts[0],txt=parts[parts.length-1];const w=who.startsWith("boss")?(BOSSES[+who.slice(4)]||{}).n:VC_WHO[who];const L2=Object.keys(NAMES).find(c=>NAMES[c]===txt&&who==="narrator"&&VOX.packOf[k2]==="words"&&!HFW.concat(Y1,Y2).some(x=>x.toLowerCase()===txt));return (w?`<small>${esc(w)}:</small> `:"")+(L2?`<small>Letter</small> ${esc(L2.toUpperCase())} <small>(${esc(txt)})</small>`:esc(txt))};
  app.innerHTML=`<div class="top"><button class="link" data-go="grown">← Grown-ups</button><span class="chip">🚩 ${n} flagged</span></div>
  <h2 class="ptitle">Check the voices</h2>
  <p class="hint">Tap ▶ to hear a recording. If it sounds wrong (wrong word, a letter sound instead of its name, odd chunk), tap 🚩. Flags are saved, and Claude can read them and re-record just those.</p>
  ${Object.keys(VOX.map).length?"":`<p class="hint">The recordings are still loading. Go back and open this again in a moment.</p>`}
  ${VC_SECTIONS.filter(([id])=>groups[id]).map(([id,name])=>{const ks=groups[id].sort((a,b)=>a.split("|").pop().localeCompare(b.split("|").pop()));const f=ks.filter(k2=>fl[k2]).length;
    return `<details class="panel vcsec"${f?" open":""}><summary><b>${name}</b> <span>${ks.length} recordings${f?` · 🚩 ${f}`:""}</span></summary><div class="vclist">${ks.map(k2=>`<div class="vcrow${fl[k2]?" flagged":""}"><button class="vcplay" data-vplay="${esc(k2)}" aria-label="Play">▶</button><span class="vctxt">${label(k2)}</span><button class="vcflag" data-vflag="${esc(k2)}" aria-pressed="${!!fl[k2]}" aria-label="Flag as wrong">🚩</button></div>`).join("")}</div></details>`}).join("")}`;
}
